name: Check public demo

on:
  push:
  pull_request:

jobs:
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check installed speech backend
        run: python -c "from faster_whisper import WhisperModel; print('CPU speech backend imports successfully')"
      - name: Install synthetic speech generator
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Download model and recognize synthetic speech
        timeout-minutes: 6
        run: python tests/smoke_speech.py
